<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F8FD" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>KairoEdge Technologies Pvt Ltd | Enterprise IT, Cloud &amp; Software | Pune (HQ) &amp; Ahilyanagar</title>
    <meta name="description" content="Enterprise IT company delivering cloud platforms, custom software, web &amp; mobile applications, and AI automation. Headquartered in Pune with a regional branch in Ahilyanagar, Maharashtra." />

    <!-- Google Fonts: Bricolage Grotesque (500/700/800) & Instrument Sans (400/500/600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization script: Locked to crisp executive light theme -->
    <script>
      (function() {
        try {
          localStorage.setItem('ke-theme', 'light');
          document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
