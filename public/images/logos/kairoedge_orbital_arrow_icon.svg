<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="orbIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="orbIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E5FF" />
    </linearGradient>
    <linearGradient id="kIconBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="kIconLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <radialGradient id="iconCardBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0c234a" />
      <stop offset="100%" stop-color="#060f1e" />
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="200" height="200" rx="44" fill="url(#iconCardBg)" stroke="rgba(0, 210, 255, 0.35)" stroke-width="2.5" />

  <!-- EMBLEM -->
  <g transform="translate(100, 100) scale(0.68)">
    <!-- 1. ORBITAL SWOOSH: Back Arc -->
    <path d="M -90 40 C -125 10, -110 -40, -45 -65 C 20 -90, 85 -75, 120 -35"
          fill="none" 
          stroke="url(#orbIconGrad)" 
          stroke-width="12" 
          stroke-linecap="round"
          opacity="0.75" />

    <!-- 2. Stylized K: Vertical Spine -->
    <rect x="-62" y="-105" width="34" height="210" rx="8" fill="url(#kIconBody)" />

    <!-- 3. Stylized K: Top Diagonal Arm -->
    <path d="M -28 -15 L 42 -105 L 82 -105 L -10 10 Z" fill="url(#kIconBody)" />

    <!-- 4. Stylized K: Bottom Diagonal Branch Sweeping Upward into Velocity Arrow -->
    <path d="M -24 0 C 10 35, 45 68, 75 70 C 105 72, 118 42, 125 15"
          fill="none" 
          stroke="url(#kIconLeg)" 
          stroke-width="28" 
          stroke-linecap="round" />
    
    <!-- Razor-sharp Arrowhead at (132, 5) -->
    <polygon points="132, -15 152, 28 116, 20" fill="#00D2FF" filter="url(#orbIconGlow)" />

    <!-- 5. ORBITAL SWOOSH: Front Arc -->
    <path d="M -115 25 C -75 75, 10 100, 75 80 C 110 70, 128 50, 136 28"
          fill="none" 
          stroke="url(#orbIconGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          filter="url(#orbIconGlow)" />
  </g>
</svg>