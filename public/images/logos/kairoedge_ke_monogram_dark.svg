<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="cyanBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E5FF" />
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Navy Background with subtle rounded border -->
  <rect width="720" height="220" rx="20" fill="#060F1E" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- MONOGRAM MARK (LEFT) -->
  <g transform="translate(42, 28)">
    <!-- 1. Vertical Spine of 'K' -->
    <path d="M 12 16 L 36 16 L 36 148 L 12 148 Z" fill="url(#spineGrad)" />

    <!-- 2. Dynamic Upward Aero Blade (Top Diagonal of K / Forward Edge) -->
    <path d="M 36 86 C 58 56, 96 32, 154 22 C 112 36, 68 68, 46 98 Z" 
          fill="url(#cyanBlade)" filter="url(#neonGlow)" />

    <!-- 3. Middle Horizontal Bar of 'E' -->
    <path d="M 62 82 L 122 82 L 108 98 L 62 98 Z" fill="url(#cyanBar)" />

    <!-- 4. Lower Diagonal of 'K' transitioning into Bottom Bar of 'E' -->
    <path d="M 36 94 L 72 134 L 146 134 L 132 148 L 60 148 L 28 114 Z" fill="url(#spineGrad)" />

    <!-- Subtle speed accent dot/notch -->
    <circle cx="160" cy="22" r="3" fill="#38E5FF" />
  </g>

  <!-- TYPOGRAPHY LOCKUP (RIGHT) -->
  <g transform="translate(236, 115)">
    <!-- Primary Brand Name: KairoEdge -->
    <text font-family="'Bricolage Grotesque', 'Instrument Sans', -apple-system, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Kairo</tspan>
      <tspan fill="url(#edgeGrad)">Edge</tspan>
    </text>

    <!-- Subtitle: TECHNOLOGIES -->
    <text y="42" 
          x="4"
          font-family="'Instrument Sans', -apple-system, sans-serif" 
          font-size="16.5" 
          font-weight="700" 
          letter-spacing="9" 
          fill="#94A3B8">
      TECHNOLOGIES
    </text>

    <!-- Sleek horizontal accent rule -->
    <line x1="4" y1="52" x2="380" y2="52" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>