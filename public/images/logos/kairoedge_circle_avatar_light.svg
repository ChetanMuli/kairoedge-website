<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Electric Cyan Orbital Gradient -->
    <linearGradient id="orbitCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077EE" />
      <stop offset="45%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E5FF" />
    </linearGradient>

    <!-- Metallic Gold Arrow Gradient -->
    <linearGradient id="goldArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3C644" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>

    <!-- Deep Navy 'K' Body Gradient -->
    <linearGradient id="navyK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2244" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Subtle Clean Background -->
    <radialGradient id="bgLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="90%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </radialGradient>
  </defs>

  <!-- Circular Container (Safe for Instagram & LinkedIn circle crop) -->
  <circle cx="256" cy="256" r="250" fill="url(#bgLight)" stroke="rgba(0, 210, 255, 0.35)" stroke-width="4" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(15, 34, 68, 0.08)" stroke-width="1.5" />

  <!-- EMBLEM: Centered in 512x512 with safe padding -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- 1. BACK ORBITAL SWOOSH (Behind K) -->
    <path d="M -90 40 C -125 10, -110 -40, -45 -65 C 20 -90, 85 -75, 120 -35"
          fill="none" 
          stroke="url(#orbitCyan)" 
          stroke-width="14" 
          stroke-linecap="round"
          opacity="0.85" />

    <!-- 2. STYLIZED 'K': Vertical Spine -->
    <rect x="-64" y="-105" width="36" height="210" rx="8" fill="url(#navyK)" />

    <!-- 3. STYLIZED 'K': Top Diagonal Arm -->
    <path d="M -28 -15 L 42 -105 L 82 -105 L -10 10 Z" fill="url(#navyK)" />

    <!-- 4. METALLIC GOLD VELOCITY ARROW (Swooping up from bottom-right of K) -->
    <path d="M -24 0 C 10 35, 45 68, 75 70 C 105 72, 118 42, 125 15"
          fill="none" 
          stroke="url(#goldArrow)" 
          stroke-width="26" 
          stroke-linecap="round" />
    
    <!-- Razor-sharp Gold Arrowhead -->
    <polygon points="132, -18 155, 26 114, 20" fill="url(#goldArrow)" filter="url(#lightGlow)" />

    <!-- 5. FRONT ORBITAL SWOOSH (In front of K) -->
    <path d="M -115 25 C -75 75, 10 100, 75 80 C 110 70, 128 50, 136 28"
          fill="none" 
          stroke="url(#orbitCyan)" 
          stroke-width="14" 
          stroke-linecap="round" 
          filter="url(#lightGlow)" />
  </g>
</svg>