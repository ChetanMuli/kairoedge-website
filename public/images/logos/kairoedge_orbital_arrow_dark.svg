<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <!-- Cyan glow -->
    <filter id="orbitalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="orbGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="45%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E5FF" />
    </linearGradient>

    <linearGradient id="kBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="kLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <radialGradient id="darkBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0b1b36" />
      <stop offset="70%" stop-color="#060f1e" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>

  <!-- Deep Midnight Navy Card with subtle cyan edge border -->
  <rect width="600" height="520" rx="28" fill="url(#darkBgGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />

  <!-- ICON EMBLEM -->
  <g transform="translate(300, 165)">
    <!-- 1. ORBITAL SWOOSH: Back Arc (behind the K) -->
    <path d="M -90 40 C -125 10, -110 -40, -45 -65 C 20 -90, 85 -75, 120 -35"
          fill="none" 
          stroke="url(#orbGrad)" 
          stroke-width="11" 
          stroke-linecap="round"
          opacity="0.75" />

    <!-- 2. Stylized K: Vertical Spine -->
    <rect x="-62" y="-105" width="34" height="210" rx="8" fill="url(#kBody)" />

    <!-- 3. Stylized K: Top Diagonal Arm -->
    <path d="M -28 -15 L 42 -105 L 82 -105 L -10 10 Z" fill="url(#kBody)" />

    <!-- 4. Stylized K: Bottom Diagonal Branch Sweeping Upward into Velocity Arrow -->
    <path d="M -24 0 C 10 35, 45 68, 75 70 C 105 72, 118 42, 125 15"
          fill="none" 
          stroke="url(#kLeg)" 
          stroke-width="28" 
          stroke-linecap="round" />
    
    <!-- Razor-sharp Arrowhead at (132, 5) -->
    <polygon points="132, -15 152, 28 116, 20" fill="#00D2FF" filter="url(#orbitalGlow)" />

    <!-- 5. ORBITAL SWOOSH: Front Arc (in front of K) -->
    <path d="M -115 25 C -75 75, 10 100, 75 80 C 110 70, 128 50, 136 28"
          fill="none" 
          stroke="url(#orbGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          filter="url(#orbitalGlow)" />
  </g>

  <!-- TYPOGRAPHY LOCKUP (BOTTOM) -->
  <g transform="translate(300, 395)" text-anchor="middle">
    <!-- Brand Title -->
    <text font-family="'Bricolage Grotesque', 'Instrument Sans', sans-serif" 
          font-size="58" 
          font-weight="800" 
          letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Kairo</tspan>
      <tspan fill="#00D2FF">Edge</tspan>
    </text>

    <!-- Subtitle: TECHNOLOGIES PRIVATE LIMITED -->
    <text y="44" 
          font-family="'Instrument Sans', sans-serif" 
          font-size="16.5" 
          font-weight="700" 
          letter-spacing="6.5" 
          fill="#94A3B8">
      TECHNOLOGIES PRIVATE LIMITED
    </text>

    <!-- Bottom subtle indicator line -->
    <line x1="-160" y1="62" x2="160" y2="62" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>