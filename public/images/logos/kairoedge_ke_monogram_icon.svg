<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="iconBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E5FF" />
    </linearGradient>
    <linearGradient id="iconSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="iconCyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c234a" />
      <stop offset="100%" stop-color="#060f1e" />
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="200" height="200" rx="44" fill="url(#cardGlow)" stroke="rgba(0, 210, 255, 0.35)" stroke-width="2.5" />

  <!-- MONOGRAM MARK -->
  <g transform="translate(18, 18)">
    <!-- 1. Vertical Spine of 'K' -->
    <path d="M 16 20 L 42 20 L 42 144 L 16 144 Z" fill="url(#iconSpine)" />

    <!-- 2. Dynamic Upward Aero Blade -->
    <path d="M 42 84 C 64 54, 102 30, 154 20 C 114 34, 72 66, 52 94 Z" 
          fill="url(#iconBlade)" filter="url(#iconGlow)" />

    <!-- 3. Middle Horizontal Bar of 'E' -->
    <path d="M 66 78 L 122 78 L 110 94 L 66 94 Z" fill="url(#iconCyanBar)" />

    <!-- 4. Lower Diagonal of 'K' transitioning into Bottom Bar of 'E' -->
    <path d="M 42 92 L 74 130 L 144 130 L 130 144 L 64 144 L 32 110 Z" fill="url(#iconSpine)" />

    <circle cx="156" cy="20" r="3" fill="#38E5FF" />
  </g>
</svg>